<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#e7d9cd">
  <meta name="description" content="以產品類別與製程能力查詢歐噴資料庫的醫療器材公開索引。">
  <title>台灣醫療器材商情查詢</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Noto+Sans+TC:wght@400;500;600;700;800&display=swap');
    :root{--paper:#e9ddd1;--ink:#25201d;--muted:#685e57;--line:#c8b8aa;--cream:#f9f3eb;--accent:#b54d38;--sea:#afcbc7;--orange:#e8ad81;--olive:#bac4a4}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:'Noto Sans TC',sans-serif;color:var(--ink)}body{background:var(--paper)}button,input{font:inherit}button{cursor:pointer}a{color:inherit}
    .app{min-height:100vh;background:linear-gradient(145deg,#f2e7da,#e9ddd1 55%,#e7d9cd)}
    .topbar{display:flex;align-items:center;justify-content:space-between;gap:24px;padding:21px 34px;border-bottom:1px solid var(--line)}
    .brand{display:flex;align-items:center;gap:15px;text-decoration:none;flex:none}.brandmark{width:32px;height:32px;display:grid;place-items:center;border:2px solid var(--ink);transform:rotate(30deg);font-family:Georgia,serif;font-size:21px;font-weight:bold}.brandmark span{transform:rotate(-30deg)}.brandtext strong{font-size:21px;letter-spacing:.055em;display:block}.brandtext small{font:11px 'DM Mono',monospace;letter-spacing:.09em;color:var(--muted)}
    .topnav{display:flex;align-items:center;gap:8px}.pill{border:1px solid var(--ink);border-radius:99px;padding:10px 17px;background:transparent;color:var(--ink);font-size:14px;font-weight:700;white-space:nowrap}.pill:hover,.pill.active{background:var(--ink);color:var(--cream)}.topnote{font:11px 'DM Mono',monospace;color:var(--muted);letter-spacing:.08em}
    .layout{display:grid;grid-template-columns:300px minmax(0,1fr);min-height:calc(100vh - 82px)}
    .left{position:sticky;top:0;align-self:start;min-height:calc(100vh - 82px);max-height:100vh;overflow:auto;padding:32px 22px 28px 32px;border-right:1px solid var(--line);background:rgba(248,239,230,.45);display:flex;flex-direction:column}
    .eyebrow{font:12px 'DM Mono',monospace;letter-spacing:.16em;color:var(--accent)}.left h1{font-size:29px;line-height:1.35;margin:23px 0 13px;letter-spacing:-.04em}.lead{font-size:15px;line-height:1.75;color:#524840;margin:0 0 21px}
    .searchbox{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:#faf4ec;padding:11px 13px}.searchbox svg{flex:none}.searchbox input{width:100%;border:0;outline:0;background:none;font-size:15px;color:var(--ink)}.searchbox input::placeholder{color:#88796f}
    .sectionlabel{display:flex;justify-content:space-between;gap:10px;margin:28px 0 12px;font:12px 'DM Mono',monospace;letter-spacing:.08em}.sectionlabel span:last-child{color:var(--muted)}
    .item-list{display:grid;gap:6px}.item{display:flex;align-items:center;gap:12px;width:100%;padding:13px 12px;text-align:left;border:1px solid transparent;background:transparent;color:var(--ink);border-radius:3px}.item:hover,.item.selected{background:#faf4ec;border-color:#c3ad9d}.item.selected{box-shadow:inset 3px 0 var(--accent)}.item .num{font:12px 'DM Mono',monospace;color:var(--accent)}.item .name{font-size:16px;font-weight:700;flex:1}.item .arrow{font-size:16px;color:var(--muted)}.empty{font-size:14px;color:var(--muted);padding:16px 8px}
    .leftbottom{margin-top:auto;padding-top:30px;font-size:13px;line-height:1.8;color:var(--muted)}.leftbottom b{color:var(--ink)}
    .right{min-width:0;max-width:1280px;width:100%;margin:0 auto;padding:35px clamp(28px,5vw,76px) 70px}.righthead{display:flex;justify-content:space-between;align-items:center;gap:20px}.righthead small{font:12px 'DM Mono',monospace;color:var(--accent);letter-spacing:.16em}.righthead span{font:12px 'DM Mono',monospace;color:var(--muted)}
    .feature{display:grid;grid-template-columns:62px 1fr;column-gap:22px;align-items:start;margin-top:29px}.feature-icon{grid-row:1/4;width:58px;height:58px;border-radius:12px;background:var(--sea);display:grid;place-items:center;font:30px Georgia,serif}.feature h2{font-size:38px;line-height:1.25;letter-spacing:-.03em;margin:0 0 9px}.feature p{font-size:17px;color:#574c44;line-height:1.8;margin:0;max-width:840px}.tags{display:flex;gap:9px;flex-wrap:wrap;margin:18px 0 0}.tag{border:1px solid #b8a699;border-radius:20px;padding:7px 13px;color:#554a43;font-size:13px}
    .divider{height:1px;background:var(--line);margin:35px 0 29px}.datahead{display:flex;justify-content:space-between;align-items:center}.datahead strong{font-size:23px}.datahead small{font:12px 'DM Mono',monospace;color:var(--muted)}
    .hint{font-size:14px;line-height:1.7;color:var(--muted);margin:0 0 13px}.queryline{display:flex;gap:9px;max-width:780px}.queryline input{min-width:0;flex:1;border:1px solid #aa998c;background:#fffaf3;padding:13px 16px;font-size:17px;outline-color:var(--accent)}.primary{border:1px solid var(--accent);border-radius:2px;background:var(--accent);color:#fff;font-size:15px;font-weight:700;padding:12px 23px;white-space:nowrap}.primary:hover{background:#8f3929}
    .results{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:21px;min-height:75px}.status{grid-column:1/-1;font-size:14px;line-height:1.65;color:var(--muted);margin:0 0 1px}.status.section-title{font-size:18px;font-weight:700;color:var(--ink);margin:15px 0 0}.result{min-width:0;border:1px solid #cfbbac;background:rgba(255,250,244,.75);padding:19px 21px;display:flex;flex-direction:column;min-height:150px}.result strong{display:block;font-size:17px;line-height:1.55}.result .meta{font-size:14px;color:var(--muted);line-height:1.65;margin:11px 0 16px}.result a{font-size:14px;color:var(--accent);font-weight:700;text-decoration:underline;text-underline-offset:4px;margin-top:auto;align-self:start}.source{font-size:13px;color:var(--muted);line-height:1.7;margin-top:26px}.source a{color:var(--ink)}
    @media(max-width:980px){.topnote{display:none}.layout{grid-template-columns:250px minmax(0,1fr)}.left{padding:25px 16px}.right{padding:27px 26px 60px}.results{grid-template-columns:1fr}.feature h2{font-size:34px}}
    @media(max-width:700px){.topbar{padding:18px;flex-wrap:wrap;gap:16px}.topnav{width:100%;overflow:auto}.pill{flex:1;padding:10px 12px;font-size:13px}.brandtext strong{font-size:18px}.brandtext small{font-size:9px}.layout{display:block}.left{position:static;min-height:0;max-height:none;border-right:0;border-bottom:1px solid var(--line);padding:23px 18px 18px}.left h1{font-size:24px;margin:12px 0 6px}.lead{font-size:14px;margin-bottom:15px}.sectionlabel{margin:19px 0 9px}.item-list{display:flex;overflow:auto;gap:7px}.item{white-space:nowrap;width:auto;border-color:#c3ad9d;padding:10px 13px}.item .num,.item .arrow{display:none}.item .name{font-size:14px}.leftbottom{display:none}.right{padding:24px 18px 55px}.feature{grid-template-columns:46px 1fr;gap:12px;margin-top:21px}.feature-icon{width:42px;height:42px;font-size:22px}.feature h2{font-size:29px}.feature p{font-size:15px}.tags{margin-top:12px}.tag{font-size:12px}.divider{margin:25px 0}.datahead strong{font-size:20px}.queryline input{font-size:16px}.primary{padding:11px 14px}.results{gap:10px}.result{padding:16px;min-height:0}.result strong{font-size:16px}}
    @media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
  </style>
</head>
<body>
<main class="app" id="app">
  <header class="topbar">
    <a class="brand" href="#" aria-label="台灣醫療器材商情查詢首頁"><span class="brandmark"><span>✳</span></span><span class="brandtext"><strong>台灣醫療器材商情查詢</strong><small>TAIWAN MEDTECH MARKET INTELLIGENCE</small></span></a>
    <span class="topnote">PUBLIC DATA · MARKET SIGNALS</span>
    <nav class="topnav" aria-label="導覽模式"><button class="pill active" data-mode="product">產品光譜</button><button class="pill" data-mode="technology">技術能力</button><button class="pill" data-mode="market">市場線索</button></nav>
  </header>
  <div class="layout">
    <aside class="left">
      <span class="eyebrow">01 / EXPLORE</span>
      <h1>選擇探索方向</h1>
      <p class="lead">選取產品類別或製程能力，右側即顯示歐噴資料庫中的相關公開條目。</p>
      <label class="searchbox"><svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></svg><input id="filter" type="search" placeholder="搜尋產品、材料、技術..." aria-label="搜尋節點"></label>
      <div class="sectionlabel"><span id="listHeading">PRODUCT SPECTRUM</span><span id="count"></span></div>
      <div class="item-list" id="itemList"></div>
      <div class="leftbottom"><b>資料判讀</b><br>分類僅供探索。公告狀態、產品規格與合作可能性，請回到原始來源查證。</div>
    </aside>
    <section class="right" aria-live="polite">
      <div class="righthead"><small>02 / MARKET INTELLIGENCE</small><span id="nodeNumber">01 — 13</span></div>
      <div class="feature"><div class="feature-icon" id="featureIcon">✳</div><h2 id="featureTitle"></h2><p id="featureDescription"></p><div class="tags" id="featureTags"></div></div>
      <div class="divider"></div>
      <div class="datahead"><strong>歐噴資料庫查詢</strong><small>LIVE SEARCH</small></div>
      <p class="hint" id="sourceHint"></p>
      <form id="dataForm" class="queryline"><input id="dataQuery" type="search" aria-label="公開資料關鍵字" required><button class="primary" type="submit">搜尋 ↗</button></form>
      <div class="results" id="results"><p class="status">選擇關鍵字並搜尋公開資料；結果不預先編造。</p></div>
      <div class="source" id="sourceFoot"></div>
    </section>
  </div>
</main>
<script>
const nodes=[
 {id:"vascular",name:"血管通路",en:"VASCULAR",glyph:"✧",type:"product",description:"導管、鞘管與通路相關的一次性醫療器材類別。可從管材、接頭、組裝與包裝能力尋找相鄰需求。",tags:["導管","鞘管","血管介入"]},
 {id:"dialysis",name:"透析迴路",en:"DIALYSIS",glyph:"◈",type:"product",description:"透析使用的體外管路、接頭與血液處理耗材。從歐噴公開索引尋找相關特材及資料來源。",tags:["血液管路","透析","接頭"]},
 {id:"drainage",name:"引流系統",en:"DRAINAGE",glyph:"⌁",type:"product",description:"體液引流、集液及相關管路系統，可交叉探索不同臨床科別的需求。",tags:["引流","集液","管路"]},
 {id:"urology",name:"泌尿照護",en:"UROLOGY",glyph:"◌",type:"product",description:"泌尿科導管與照護耗材的產品類別，可查詢相關特材條目及資料集。",tags:["導尿","泌尿","袋體"]},
 {id:"infusion",name:"輸液連接",en:"INFUSION",glyph:"＋",type:"product",description:"輸注用管路、轉接與流體連接器的應用範圍。",tags:["輸液","連接器","流體"]},
 {id:"sampling",name:"穿刺採樣",en:"SAMPLING",glyph:"↗",type:"product",description:"穿刺、取樣與檢體收集相關器材，可從針具及組件製造能力延伸探索。",tags:["穿刺","採樣","針具"]},
 {id:"extrusion",name:"精密押出",en:"EXTRUSION",glyph:"≋",type:"technology",description:"單腔、多腔或不同硬度組合的管材製程能力，可連結多種導管與流體產品。",tags:["多腔管","管材","公差"]},
 {id:"molding",name:"精密射出",en:"MOLDING",glyph:"⬡",type:"technology",description:"醫療等級塑件、連接器與複合零組件的成型及組裝能力。",tags:["塑件","接頭","組裝"]},
 {id:"forming",name:"導管成型",en:"FORMING",glyph:"⌇",type:"technology",description:"尖端成型、打孔、熱接合等導管二次加工能力。",tags:["尖端","熱接合","加工"]},
 {id:"coating",name:"表面處理",en:"SURFACE",glyph:"◒",type:"technology",description:"塗層與表面改質等方向，需依實際材料、驗證及適用法規評估可行性。",tags:["塗層","表面改質","驗證"]},
 {id:"assembly",name:"潔淨組裝",en:"ASSEMBLY",glyph:"⊞",type:"technology",description:"零組件整合、潔淨環境組裝與一次性器材製造流程。",tags:["潔淨室","組裝","一次性"]},
 {id:"taiwan",name:"醫院機構",en:"HOSPITALS",glyph:"◎",type:"market",description:"搜尋歐噴收錄的醫院與醫療機構資料；出現在索引中不代表有採購需求。",tags:["醫院","機構","台灣"]},
 {id:"global",name:"醫材業者",en:"COMPANIES",glyph:"✺",type:"market",description:"搜尋歐噴收錄的醫療器材製造與流通業者線索；營業登記不代表合作意願。",tags:["醫療器材","製造","批發"]}
];
const colors={product:"#a9c4c1",technology:"#e8aa76",market:"#b6b994"};
let mode="product",selected=nodes[0],requestId=0;
const $=s=>document.querySelector(s),escapeHTML=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function safeURL(url){try{const u=new URL(url,"https://data.openfun.tw");return u.protocol==="https:"&&u.hostname==="data.openfun.tw"?u.href:"#"}catch{return "#"}}
function openfunQuery(node){return ({vascular:"導管",dialysis:"透析",drainage:"引流",urology:"導尿",infusion:"輸液",sampling:"穿刺",extrusion:"導管",molding:"接頭",forming:"導管",coating:"塗層",assembly:"醫療器材",taiwan:"醫院",global:"醫療器材"})[node.id]||"醫療器材"}
function modeNodes(){return mode==="product"?nodes.filter(n=>n.type==="product"):mode==="technology"?nodes.filter(n=>n.type==="technology"):nodes.filter(n=>n.type==="market")}
function render(){
  const query=$("#filter").value.trim().toLowerCase(),view=modeNodes(),filtered=view.filter(n=>(n.name+n.en+n.tags.join("")).toLowerCase().includes(query));
  $("#listHeading").textContent=({product:"PRODUCT SPECTRUM",technology:"TECH CAPABILITIES",market:"MARKET SIGNALS"})[mode];
  $("#count").textContent=String(filtered.length).padStart(2,"0")+" / "+String(view.length).padStart(2,"0");
  $("#itemList").innerHTML=filtered.length?filtered.map((n,i)=>`<button class="item ${selected.id===n.id?"selected":""}" data-id="${n.id}"><span class="num">${String(i+1).padStart(2,"0")}</span><span class="name">${escapeHTML(n.name)}</span><span class="arrow">↗</span></button>`).join(""):'<div class="empty">找不到相符的節點</div>';
  $("#nodeNumber").textContent=String(nodes.indexOf(selected)+1).padStart(2,"0")+" — "+nodes.length;
  $("#featureIcon").textContent=selected.glyph;$("#featureIcon").style.background=colors[selected.type];
  $("#featureTitle").textContent=selected.name;$("#featureDescription").textContent=selected.description;
  $("#featureTags").innerHTML=selected.tags.map(t=>`<span class="tag">${escapeHTML(t)}</span>`).join("");
  $("#sourceHint").textContent="搜尋歐噴資料庫的公開資料集與條目，包含健保特材、公司及醫療機構資料。";
  $("#dataQuery").placeholder="例如：導管、醫療器材、醫院";
  if(document.activeElement!==$("#dataQuery")) $("#dataQuery").value=openfunQuery(selected);
  $("#sourceFoot").innerHTML='資料來源：<a href="https://data.openfun.tw/" target="_blank" rel="noopener noreferrer">歐噴資料庫</a>公開搜尋索引。逐筆資料 API 可能需授權；本頁僅顯示搜尋摘要，請至來源頁查證。';
}
function choose(id){selected=nodes.find(n=>n.id===id)||selected;requestId++;render();search($("#dataQuery").value.trim())}
function setMode(next){mode=next;selected=modeNodes()[0];document.querySelectorAll(".pill[data-mode]").forEach(b=>b.classList.toggle("active",b.dataset.mode===mode));choose(selected.id)}
async function getJSON(url,options={}){const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),15000);try{const response=await fetch(url,{...options,signal:controller.signal});if(!response.ok)throw new Error("HTTP "+response.status);return await response.json()}finally{clearTimeout(timer)}}
function renderOpenFun(data){
 const datasets=Array.isArray(data.datasets?.results)?data.datasets.results:[],groups=Array.isArray(data.entities?.groups)?data.entities.groups:[];
 const namedDatasets=datasets.filter(r=>String(r.title||"").toLowerCase().includes(String(data.q||"").toLowerCase()));
 const entityCards=groups.flatMap(g=>(Array.isArray(g.entities)?g.entities.slice(0,3):[]).map(e=>({group:g,name:e.name,url:e.url}))).slice(0,12);
 const count=Number(data.entities?.total)||0,datasetCount=Number(data.datasets?.total)||0;
 let html=`<p class="status">公開索引中有 ${count.toLocaleString()} 筆條目、${datasetCount.toLocaleString()} 份資料集命中關鍵字；下方只顯示部分摘要，並非銷售量或可投標件數。</p>`;
 if(entityCards.length){html+='<p class="status section-title">相關資料條目</p>'+entityCards.map(r=>`<article class="result"><strong>${escapeHTML(r.name||"未提供名稱")}</strong><p class="meta">${escapeHTML(r.group.dataset_title||"資料來源未提供")} · 此資料集相符 ${Number(r.group.total||0).toLocaleString()} 筆</p><a href="${escapeHTML(safeURL(r.url||r.group.dataset_url))}" target="_blank" rel="noopener noreferrer">查看歐噴條目 ↗</a></article>`).join("")}
 if(namedDatasets.length){html+='<p class="status section-title">名稱相符的資料集</p>'+namedDatasets.slice(0,6).map(r=>`<article class="result"><strong>${escapeHTML(r.title||r.slug||"資料集")}</strong><p class="meta">${escapeHTML((r.description||r.slug||"").slice(0,180))}${(r.description||"").length>180?"…":""}</p><a href="${escapeHTML(safeURL(r.url||"https://data.openfun.tw/datasets/"+encodeURIComponent(r.slug||"")))}" target="_blank" rel="noopener noreferrer">查看資料集與來源 ↗</a></article>`).join("")}
 if(!entityCards.length&&!namedDatasets.length)html+='<p class="status">沒有找到名稱相符的條目或資料集；可換較短的關鍵字，例如「導管」或「透析」。</p>';
 $("#results").innerHTML=html;
}
async function search(query){
 const seq=++requestId;
 $("#results").innerHTML='<p class="status">正在讀取歐噴資料…</p>';
 try{
  const data=await getJSON("https://data.openfun.tw/api/v1/search?"+new URLSearchParams({q:query,per_dataset:"3",max_datasets:"10"}));
  if(seq===requestId)renderOpenFun(data);
 }catch(error){
  if(seq===requestId)$("#results").innerHTML=`<p class="status">歐噴資料庫目前無法回傳結果（${escapeHTML(error.message)}）。請稍後重試。</p>`;
 }
}
document.addEventListener("click",e=>{const node=e.target.closest("[data-id]");if(node)choose(node.dataset.id)});
document.querySelectorAll("[data-mode]").forEach(b=>b.addEventListener("click",()=>setMode(b.dataset.mode)));
$("#filter").addEventListener("input",render);
$("#dataForm").addEventListener("submit",e=>{e.preventDefault();const q=$("#dataQuery").value.trim();if(q)search(q)});
render();search(openfunQuery(selected));
</script>
</body>
</html>
