function renderTender(data){const rows=tenderItems(data).slice(0,12),total=Number(data.total_records)||rows.length;
  $("#results").innerHTML=`<p class="status">找到 ${total.toLocaleString()} 筆公告紀錄 · 第 ${page} 頁。日期與狀態以原始公告為準。</p>`+(rows.length?rows.map(r=>{const name=r.brief?.title||r.title||"未提供標案名稱",unit=r.unit_name||r.detail?.["機關資料:機關名稱"]||"機關未提供",type=r.brief?.type||r.type||"公告",date=r.date?String(r.date).replace(/^(\d{4})(\d{2})(\d{2})$/,"$1-$2-$3"):"日期未提供",u=r.url?safeURL(r.url):r.tender_api_url?safeURL(r.tender_api_url):"#";return `<article class="result"><strong>${escapeHTML(name)}</strong><p class="meta">${escapeHTML(unit)} · ${escapeHTML(type)} · ${escapeHTML(date)}</p>${u!=="#"?`<a href="${escapeHTML(u)}" target="_blank" rel="noopener noreferrer">查看公告 ↗</a>`:""}</article>`}).join(""):'<p class="status">此頁沒有相符的公告。可更換產品用語。</p>')+(Number(data.total_pages)>1?`<div class="pagination"><button type="button" data-page="-1" ${page<=1?"disabled":""}>← 上一頁</button><span>第 ${page} / ${data.total_pages} 頁</span><button type="button" data-page="1" ${page>=data.total_pages?"disabled":""}>下一頁 →</button></div>`:"")}
function renderFDA(data){const rows=Array.isArray(data.results)?data.results:[];$("#results").innerHTML=`<p class="status">本次顯示 ${rows.length} 筆 FDA 公開紀錄；依 API 查詢結果排列。</p>`+(rows.length?rows.map(r=>`<article class="result"><strong>${escapeHTML(r.applicant||"廠商未提供")}</strong><p class="meta">${escapeHTML(r.device_name||"器材名稱未提供")} · ${escapeHTML(r.decision_date||"日期未提供")} · ${escapeHTML(r.k_number||"")}</p>${r.k_number?`<a href="https://www.accessdata.fda.gov/scripts/cdrh/cfdocs/cfpmn/pmn.cfm?ID=${encodeURIComponent(r.k_number)}" target="_blank" rel="noopener noreferrer">FDA 原始紀錄 ↗</a>`:""}</article>`).join(""):'<p class="status">沒有相符紀錄，請換用較通用的英文器材詞。</p>')}
function renderOpenFun(data){
 const datasets=Array.isArray(data.datasets?.results)?data.datasets.results:[],groups=Array.isArray(data.entities?.groups)?data.entities.groups:[];
 const namedDatasets=datasets.filter(r=>String(r.title||"").toLowerCase().includes(String(data.q||"").toLowerCase()));
 const entityCards=groups.flatMap(g=>(Array.isArray(g.entities)?g.entities.slice(0,3):[]).map(e=>({group:g,name:e.name,url:e.url}))).slice(0,12);
 const count=Number(data.entities?.total)||0,datasetCount=Number(data.datasets?.total)||0;
 let html=`<p class="status">公開索引中有 ${count.toLocaleString()} 筆條目、${datasetCount.toLocaleString()} 份資料集命中關鍵字；下方只顯示部分摘要，並非銷售量或可投標件數。</p>`;
 if(entityCards.length){html+='<p class="status section-title">相關資料條目</p>'+entityCards.map(r=>`<article class="result"><strong>${escapeHTML(r.name||"未提供名稱")}</strong><p class="meta">${escapeHTML(r.group.dataset_title||"資料來源未提供")} · 此資料集相符 ${Number(r.group.total||0).toLocaleString()} 筆</p><a href="${escapeHTML(safeURL(r.url||r.group.dataset_url))}" target="_blank" rel="noopener noreferrer">查看歐噴條目 ↗</a></article>`).join("")}
 if(namedDatasets.length){html+='<p class="status section-title">名稱相符的資料集</p>'+namedDatasets.slice(0,6).map(r=>`<article class="result"><strong>${escapeHTML(r.title||r.slug||"資料集")}</strong><p class="meta">${escapeHTML((r.description||r.slug||"").slice(0,180))}${(r.description||"").length>180?"…":""}</p><a href="${escapeHTML(safeURL(r.url||"https://data.openfun.tw/datasets/"+encodeURIComponent(r.slug||"")))}" target="_blank" rel="noopener noreferrer">查看資料集與來源 ↗</a></article>`).join("")}
 if(!entityCards.length&&!namedDatasets.length)html+='<p class="status">沒有找到名稱相符的條目或資料集；可換較短的關鍵字，例如「導管」或「透析」。</p>';
 $("#results").innerHTML=html;
}
async function search(query,requestedPage=1){const seq=++requestId;page=requestedPage;lastQuery=query;$("#results").innerHTML='<p class="status">正在讀取公開資料…</p>';
 try{let data;if(source==="tender"){data=await getJSON("https://pcc-api.openfun.app/api/searchbytitle?"+new URLSearchParams({query,page:String(page)}));if(seq===requestId)renderTender(data)}
 else if(source==="fda"){const clean=query.replace(/["\\]/g," ").trim();data=await getJSON("https://api.fda.gov/device/510k.json?"+new URLSearchParams({search:`device_name:"${clean}"`,limit:"12"}));if(seq===requestId)renderFDA(data)}
 else{data=await getJSON("https://data.openfun.tw/api/v1/search?"+new URLSearchParams({q:query,per_dataset:"3",max_datasets:"10"}));if(seq===requestId)renderOpenFun(data)}}
 catch(error){if(seq===requestId)$("#results").innerHTML=`<p class="status">目前無法取得資料（${escapeHTML(error.message)}）。可稍後重試或開啟上方來源網站直接查詢。</p>`}}
document.addEventListener("click",e=>{const node=e.target.closest("[data-id]");if(node){choose(node.dataset.id);return}const pg=e.target.closest("[data-page]");if(pg)search(lastQuery,Math.max(1,page+Number(pg.dataset.page)))});
document.querySelectorAll("[data-mode]").forEach(b=>b.addEventListener("click",()=>setMode(b.dataset.mode)));
document.querySelectorAll("[data-source]").forEach(b=>b.addEventListener("click",()=>setSource(b.dataset.source)));
$("#filter").addEventListener("input",render);
$("#dataForm").addEventListener("submit",e=>{e.preventDefault();const q=$("#dataQuery").value.trim();if(q)search(q)});
render();search(selected.tw);
</script>
</body>
</html>
