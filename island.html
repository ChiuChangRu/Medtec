const R=1.39,tiles=data.map(d=>({...d,x:Math.sqrt(3)*R*(d.q+d.r/2),z:1.5*R*d.r}));
const centerX=tiles.reduce((a,t)=>a+t.x,0)/tiles.length,centerZ=tiles.reduce((a,t)=>a+t.z,0)/tiles.length;tiles.forEach(t=>{t.x-=centerX;t.z-=centerZ});
let selected=null,filter='all',listQuery='',token='',querySeq=0,recordSeq=0,anim=0,paused=matchMedia('(prefers-reduced-motion: reduce)').matches,showTraffic=true,showLabels=true,showLinks=false,hover=-1,timeTarget=1,timeValue=1,night=0;
let view={yaw:-.55,elev:.67,zoom:1,x:0,z:0},target={...view},W=1,H=1,S=1,cx=0,cy=0,dpr=1,geometry=[],hitPolys=[],last=0,drag=null,moved=false;

function toast(message){$('#toast').textContent=message;$('#toast').classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>$('#toast').classList.remove('show'),2800)}
function safeURL(url){try{const u=new URL(url,'https://data.openfun.tw');return u.protocol==='https:'&&u.hostname==='data.openfun.tw'?u.href:'#'}catch{return '#'}}
function authHTML(){return `<details class="auth"><summary>歐噴 API Token · ${token?'已設定':'逐筆查詢需授權'}</summary><input type="password" id="token" placeholder="${token?'已設定，重新貼上可更換':'貼上歐噴 API Token'}" autocomplete="off" spellcheck="false" aria-label="歐噴 API Token"><button id="setToken">${token?'更換':'啟用'}</button><button id="clearToken">清除</button><p id="tokenStatus">${token?'Token 已留在此分頁，內容已隱藏。':'公開索引可直接搜尋。Token 僅保留於此分頁，重新整理即清除。'}</p><a href="https://data.openfun.tw/user" target="_blank" rel="noopener noreferrer" style="font-size:12px">前往歐噴取得 Token ↗</a></details>`}
function showList(){window.medtechScene?.home();window.previewMarker?.select(-1);$('#personCard')?.remove();selected=null;target.x=0;target.z=0;target.zoom=1;querySeq++;recordSeq++;$('#sceneTitle').textContent='沿著產品，走進醫材的風景。';$('#sideContent').innerHTML=`<h2>把需求，連起來。</h2><p class="side-lead">中央醫院與六座產品工廠，連結供應服務及品牌／OEM 客戶。<br>點選島名，探索對應資料。</p><div class="searchwrap"><input id="listSearch" type="search" placeholder="搜尋產品、技術、關鍵字…" aria-label="搜尋地塊" value="${esc(listQuery)}"></div><div class="filtertabs"><button data-filter="all">全部</button><button data-filter="product">產品工廠</button><button data-filter="supplier">供應服務</button><button data-filter="market">醫院／客戶</button></div><div class="tile-list" id="tileList"></div><div class="side-foot"><span class="live-dot"></span>資料線索來自歐噴資料庫<br>島嶼為探索介面；建築大小與動畫不代表市場規模、銷售量或真實交易。</div>`;renderList();$('#listSearch').addEventListener('input',e=>{listQuery=e.target.value;renderList()})}
function renderList(){const list=tiles.filter(t=>(filter==='all'||t.type===filter)&&(t.name+t.en+t.tags.join('')).toLowerCase().includes(listQuery.toLowerCase()));$('#tileList').innerHTML=list.length?list.map(t=>`<button class="tile-item" data-tile="${t.i}"><span class="tile-icon" style="background:${t.color}">${t.icon}</span><span><span class="title">${t.name}</span><span class="subtitle">${t.en}</span></span><span class="arrow">↗</span></button>`).join(''):'<p class="empty">沒有相符的方向，請換個關鍵字。</p>';document.querySelectorAll('[data-filter]').forEach(b=>b.classList.toggle('active',b.dataset.filter===filter))}
function choose(i){$('#personCard')?.remove();window.previewMarker?.select(i);selected=tiles[i];window.medtechScene?.focus(i);target.x=selected.x;target.z=selected.z;target.zoom=1.32;$('#sceneTitle').textContent=selected.name+' · '+selected.tags.join('／');$('#sideContent').innerHTML=`<button class="back" id="backList">← 回到探索清單</button><div class="detail-top"><div class="thumb-wrap"><img id="detailThumb" src="town-preview.jpg?v=4" alt="${selected.name}島嶼場景"><span>${selected.icon}</span></div><div><p class="detail-num">${String(i+1).padStart(2,'0')} / ${selected.en}</p><h2>${selected.name}</h2></div></div><p class="side-lead">${selected.description}</p><div class="tags">${selected.tags.map(t=>`<span>${t}</span>`).join('')}</div><h3 class="results-heading">歐噴資料庫查詢</h3><form class="query-form" id="queryForm"><input id="query" aria-label="歐噴關鍵字" value="${selected.query}" required><button class="primary">搜尋 ↗</button></form>${authHTML()}<div id="queryResults"><p class="status">正在搜尋公開索引…</p></div><div id="records"></div><p class="source-note">來源：<a href="https://data.openfun.tw/" target="_blank" rel="noopener noreferrer">歐噴資料庫</a>。索引條目不等同採購需求，請核對原始來源及資料期間。</p>`;$('#sidebar').scrollTop=0;document.body.classList.add('panel-open');runQuery(selected.query)}
async function json(url,withToken=true){const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),15000);try{const response=await fetch(url,{headers:withToken&&token?{Authorization:'Bearer '+token}:{},signal:controller.signal,cache:'no-store',referrerPolicy:'no-referrer'});if(!response.ok)throw Error(response.status===401||response.status===403?'Token 無效或沒有此資料集權限（'+response.status+'）':'歐噴回應 HTTP '+response.status);return await response.json()}finally{clearTimeout(timer)}}
async function runQuery(q){const seq=++querySeq;recordSeq++;$('#records').innerHTML='';$('#queryResults').innerHTML='<p class="status">正在搜尋歐噴資料…</p>';try{const result=await json('https://data.openfun.tw/api/v1/search?'+new URLSearchParams({q,per_dataset:'2',max_datasets:'10'}));if(seq!==querySeq)return;const groups=(result.entities?.groups||[]).filter(g=>/健保|特材|醫療|醫院|稅籍|公司登記|機關代碼/.test(g.dataset_title||'')),items=groups.flatMap(g=>(g.entities||[]).slice(0,2).map(e=>({name:e.name,source:g.dataset_title,url:e.url||g.dataset_url,slug:g.dataset_slug||g.slug}))).slice(0,8),datasets=(result.datasets?.results||[]).filter(d=>(d.title||'').includes(q)).slice(0,4);let html=`<p class="status">歐噴全域索引命中 ${Number(result.entities?.total||0).toLocaleString()} 筆條目；下列為醫療及業者相關摘要。</p>`;const card=r=>`<article class="result"><strong>${esc(r.name)}</strong><p>${esc(r.source||'')}</p><a href="${esc(safeURL(r.url))}" target="_blank" rel="noopener noreferrer">歐噴來源 ↗</a>${r.slug?`<button data-records="${esc(encodeURIComponent(r.slug))}">逐筆資料</button>`:''}</article>`;html+=items.map(card).join('');html+=datasets.map(d=>card({name:d.title,source:(d.description||'').slice(0,100),url:d.url||'https://data.openfun.tw/datasets/'+encodeURIComponent(d.slug),slug:d.slug})).join('');if(!items.length&&!datasets.length)html+='<p class="status">沒有相符的醫療條目，可換用較短關鍵字或機構名稱。</p>';$('#queryResults').innerHTML=html}catch(e){if(seq===querySeq)$('#queryResults').innerHTML=`<p class="status">${esc(e.name==='AbortError'?'查詢逾時，請重試。':e.message)}</p>`}}
async function records(slug){if(!token){const d=$('.auth');d.open=true;$('#token').focus();toast('請先輸入歐噴 Token 並啟用');return}const seq=++recordSeq;$('#records').innerHTML='<p class="status">正在讀取此資料集前 10 筆紀錄…</p>';try{const r=await json('https://data.openfun.tw/api/v1/datasets/'+encodeURIComponent(slug)+'/records?per_page=10&page=1');if(seq!==recordSeq)return;$('#records').innerHTML=`<h3 class="results-heading">逐筆資料</h3><p class="status">共 ${Number(r.total||0).toLocaleString()} 筆紀錄，以下為前 10 筆。</p>`+(r.records||[]).map(row=>`<article class="record-row"><dl>${Object.entries(row).map(([k,v])=>`<dt>${esc(k)}</dt><dd>${esc(v===null?'—':typeof v==='object'?JSON.stringify(v):v)}</dd>`).join('')}</dl></article>`).join('');if(!(r.records||[]).length)$('#records').innerHTML+='<p class="status">此資料集未回傳紀錄。</p>'}catch(e){if(seq===recordSeq)$('#records').innerHTML=`<p class="status">${esc(e.message)}</p>`}}
document.addEventListener('click',e=>{const t=e.target.closest('[data-tile]'),f=e.target.closest('[data-filter]'),b=e.target.closest('[data-records]');if(t)choose(+t.dataset.tile);if(f){filter=f.dataset.filter;renderList()}if(b)records(decodeURIComponent(b.dataset.records));if(e.target.id==='backList')showList();if(e.target.id==='setToken'){const v=$('#token').value.trim().replace(/^Bearer\s+/i,'');if(!v){toast('請先貼上 Token');return}token=v;$('#token').value='';$('#token').placeholder='已設定，重新貼上可更換';$('#tokenStatus').textContent='Token 已留在本分頁，內容已隱藏。逐筆查詢時驗證權限。';$('.auth summary').textContent='歐噴 API Token · 已設定';toast('Token 已設定，可查詢逐筆資料')}if(e.target.id==='clearToken'){token='';recordSeq++;$('#records').innerHTML='';$('#token').value='';$('#token').placeholder='貼上歐噴 API Token';$('#tokenStatus').textContent='Token 已清除。';$('.auth summary').textContent='歐噴 API Token · 逐筆查詢需授權';toast('Token 已清除')}});
document.addEventListener('submit',e=>{if(e.target.id==='queryForm'){e.preventDefault();runQuery($('#query').value.trim())}});
document.addEventListener('keydown',e=>{if(e.target.id==='token'&&e.key==='Enter'){e.preventDefault();$('#setToken').click()}if(e.key==='Escape'){$('#help').hidden=true;document.body.classList.remove('panel-open')}});
$('#home').onclick=()=>{target={yaw:-.55,elev:.67,zoom:1,x:0,z:0};showList();document.body.classList.remove('panel-open');toast('回到全景')};$('#listToggle').onclick=()=>{if(innerWidth<=700){if(selected){showList();document.body.classList.add('panel-open')}else document.body.classList.toggle('panel-open')}else showList()};$('#closePanel').onclick=()=>document.body.classList.remove('panel-open');$('#helpButton').onclick=()=>$('#help').hidden=false;$('#dismissHelp').onclick=()=>$('#help').hidden=true;$('#zoomIn').onclick=()=>target.zoom=Math.min(2.4,target.zoom*1.2);$('#zoomOut').onclick=()=>target.zoom=Math.max(.6,target.zoom/1.2);
document.querySelectorAll('[data-time]').forEach(b=>b.onclick=()=>{timeTarget=+b.dataset.time;document.querySelectorAll('[data-time]').forEach(x=>x.classList.toggle('active',x===b));$('#clock').textContent=['06:00','12:00','18:00','21:00'][timeTarget]});
function toggle(id,get,set){$('#'+id).onclick=()=>{set(!get());$('#'+id).classList.toggle('active',get());$('#'+id).setAttribute('aria-pressed',String(get()))}}toggle('labels',()=>showLabels,v=>showLabels=v);toggle('traffic',()=>showTraffic,v=>showTraffic=v);toggle('connections',()=>showLinks,v=>showLinks=v);toggle('pause',()=>paused,v=>{paused=v;$('#pause').textContent=v?'▶ 播放':'Ⅱ 暫停'});$('#pause').classList.toggle('active',paused);$('#aerial').onclick=()=>{const top=target.elev<1;target.elev=top?1.36:.67;$('#aerial').classList.toggle('active',top)};

$('#labels').classList.add('active');

function previewPeople(){return tiles.flatMap((t,i)=>Array.from({length:13},(_,j)=>{const role=t.role==='hospital'?['doctor','nurse','patient'][((j<10?j:j-10)+i)%3]:t.role,id=i*13+j;return{id,name:(roleNames[role]||'工作人員')+' '+String(id+1).padStart(3,'0'),role:roleNames[role],island:t.name,task:'需啟動 3D 才能查看即時工作與視角'}}))}
function openPeople(){const people=window.medtechScene?.listPeople()||previewPeople();$('#sideContent').innerHTML=`<button class="back" id="backList">← 回到島嶼清單</button><h2>島上的每一個人。</h2><p class="side-lead">${people.length} 位角色各有自己的工作與視角。點選人物後，可切換跟隨、人物視角及鳥瞰。</p><div class="searchwrap"><input id="peopleSearch" type="search" aria-label="搜尋角色" placeholder="搜尋角色、島嶼或工作…"></div><div class="people-list" id="peopleList"></div>`;const draw=q=>{$('#peopleList').innerHTML=people.filter(p=>(p.name+p.island+p.task).includes(q)).map(p=>`<button class="person-item" data-person="${p.id}" ${window.medtechScene?'':'disabled'}><strong>${esc(p.name)}</strong><span>${esc(p.island)}</span><small>${esc(p.task)}</small></button>`).join('')};draw('');$('#peopleSearch').oninput=e=>draw(e.target.value.trim());document.body.classList.add('panel-open')}
window.showPersonInfo=p=>{let card=$('#personCard');if(!card){card=document.createElement('aside');card.id='personCard';card.className='person-card';document.body.appendChild(card)}card.dataset.person=p.id;card.innerHTML=`<button id="closePerson" class="close-person" aria-label="離開人物視角">×</button><small>${esc(p.island)}</small><strong>${esc(p.name)}</strong><p id="personTask">${esc(p.task)}</p><div class="person-views">${[['follow','跟隨'],['first','人物視角'],['top','鳥瞰']].map(([v,n])=>`<button data-person="${p.id}" data-person-view="${v}" class="${p.mode===v?'active':''}">${n}</button>`).join('')}</div>`;if(innerWidth<=700)document.body.classList.remove('panel-open')};
window.updatePersonInfo=p=>{if($('#personCard')?.dataset.person===String(p.id))$('#personTask').textContent=p.task};
document.addEventListener('click',e=>{const b=e.target.closest('[data-person]');if(b)window.medtechScene?.selectPerson(+b.dataset.person,b.dataset.personView);if(e.target.id==='closePerson'){$('#personCard')?.remove();window.medtechScene?.clearPerson()}});
window.showIslandPreview=note=>{window.previewLabelCleanup?.();const stage=$('#island');stage.innerHTML='<img class="scene-fallback" src="town-preview.jpg?v=4" alt="醫院、工廠與供應商群島預覽"><p class="webgl-note"></p>';stage.querySelector('.webgl-note').textContent=note;const marker=window.MedtechLabels.create(stage,tiles);window.previewMarker=marker;marker.root.style.display=showLabels?'':'none';const image=stage.querySelector('img');const update=()=>{const r=stage.getBoundingClientRect(),iw=1200,ih=1000,k=Math.max(r.width/iw,r.height/ih),ox=(r.width-iw*k)/2,oy=(r.height-ih*k)/2;marker.update(window.MEDTECH_PREVIEW_POINTS.map(([u,v])=>({x:ox+u*iw*k,y:oy+v*ih*k})),r.width,r.height)};image.onload=update;const observer=new ResizeObserver(update);observer.observe(stage);update();window.previewLabelCleanup=()=>{observer.disconnect();marker.destroy();window.previewMarker=null}};
window.MEDTECH_PREVIEW_POINTS=[[0.5,0.467697],[0.645086,0.534259],[0.486712,0.591227],[0.344123,0.518735],[0.369354,0.407759],[0.511027,0.365192],[0.643699,0.420646],[0.807147,0.608609],[0.470386,0.742993],[0.174451,0.574289],[0.251094,0.353504],[0.520323,0.278766],[0.776593,0.377134],[0.790432,0.481978]];
showList();
setTimeout(()=>{if(!window.medtechScene&&!$('#island').querySelector('.scene-fallback'))window.showIslandPreview('3D 尚未載入，先顯示場景預覽。島名仍可點選查詢。')},15000);
})();
</script>
