function project(p){const x=p[0]-view.x,z=p[2]-view.z,c=Math.cos(view.yaw),s=Math.sin(view.yaw),u=x*c-z*s,d=x*s+z*c;return[cx+u*S,cy+(d*Math.sin(view.elev)-p[1]*Math.cos(view.elev))*S,d*Math.cos(view.elev)+p[1]*Math.sin(view.elev)]}
function polygon(points,fill,stroke=null,width=1){ctx.beginPath();points.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.closePath();ctx.fillStyle=fill;ctx.fill();if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=width;ctx.stroke()}}
function shade(f){if(f.glow){return night>.35?hexRGB(mix(rgb('#74998d'),rgb('#efd9a1'),night)):f.c}let bright=.87;if(f.normal){const n=f.normal;bright=.74+Math.max(0,n[0]*-.4+n[1]*.8+n[2]*-.2)*.32;if(n[1]===1)bright=1.02}let c=rgb(f.c).map(v=>v*bright);if(timeValue>1.05&&timeValue<2.95){const dusk=Math.max(0,1-Math.abs(timeValue-2));c=mix(c,[202,161,117],dusk*.17)}c=mix(c,[46,65,63],night*.66);return hexRGB(c)}
function drawGeometry(extra=[]){const v=[Math.sin(view.yaw)*Math.cos(view.elev),Math.sin(view.elev),Math.cos(view.yaw)*Math.cos(view.elev)],list=[];for(const f of geometry.concat(extra)){if(f.normal&&f.normal[0]*v[0]+f.normal[1]*v[1]+f.normal[2]*v[2]<-.01)continue;const p=f.points.map(project);list.push({f,p,d:p.reduce((a,k)=>a+k[2],0)/p.length})}list.sort((a,b)=>a.f.layer-b.f.layer||a.d-b.d);for(const {f,p} of list)polygon(p,shade(f),f.stroke)}
function dynamicGeometry(){const old=geometry;geometry=[];if(showTraffic){cars.forEach((car,i)=>{const a=tiles[car.e[0]],b=tiles[car.e[1]],t=(anim*car.speed+car.offset)%1,x=a.x+(b.x-a.x)*t,z=a.z+(b.z-a.z)*t,w=.12,d=.26;box(x,.49,z,w,.13,d,car.color,{top:'#f0edda'});box(x,.62,z-.055,w*.9,.06,d*.4,'#b0c8bd');box(x-.067,.48,z-.07,.025,.05,.055,'#637364');box(x+.067,.48,z+.07,.025,.05,.055,'#637364')});tiles.forEach((t,i)=>{for(let j=0;j<2;j++){const phase=anim*.13+i+j*2.7,px=t.x+Math.sin(phase)*.85,pz=t.z+.14+j*.18;box(px,.46,pz,.052,.13,.052,j?'#9ba884':'#c09c73');cylinder(px,.59,pz,.032,.04,'#d9c5a0',5)}})}const extra=geometry;geometry=old;return extra}
function water(){const palette=[[228,234,217],[227,234,217],[236,219,191],[40,59,62]],k=Math.floor(timeValue),f=timeValue-k,bg=mix(palette[k],palette[Math.min(3,k+1)],f);ctx.fillStyle=hexRGB(bg);ctx.fillRect(0,0,W,H);const grad=ctx.createRadialGradient(W*.48,H*.48,20,W*.5,H*.5,W*.7);grad.addColorStop(0,night>.4?'#b6c7ad09':'#fff9e340');grad.addColorStop(1,'#68887712');ctx.fillStyle=grad;ctx.fillRect(0,0,W,H);ctx.strokeStyle=night>.4?'#99b6a218':'#a3b79a30';ctx.lineWidth=1;for(let i=0;i<34;i++){const x=(i*137.7+Math.sin(anim*.14+i)*7)%(W+100)-50,y=(i*79.4+anim*.9)%(H+80)-40;ctx.beginPath();ctx.moveTo(x,y);ctx.bezierCurveTo(x+10,y-3,x+17,y+3,x+28,y);ctx.stroke()}const p=project([0,-.40,0]);ctx.fillStyle=night>.4?'#112b2526':'#5d7e4e19';ctx.beginPath();ctx.ellipse(p[0]+12,p[1]+25,S*5.5,S*2.7,view.yaw*.08,0,Math.PI*2);ctx.fill()}
function links(){if(!showLinks)return;edges.filter((_,i)=>i%2===0).forEach(([a,b],i)=>{const t1=tiles[a],t2=tiles[b],p1=project([t1.x,.8,t1.z]),p2=project([t2.x,.8,t2.z]);ctx.strokeStyle=night>.4?'#e6d5a28a':'#7c95658a';ctx.lineWidth=1.4;ctx.setLineDash([4,6]);ctx.lineDashOffset=-anim*10;ctx.beginPath();ctx.moveTo(p1[0],p1[1]);ctx.quadraticCurveTo((p1[0]+p2[0])/2,(p1[1]+p2[1])/2-40,p2[0],p2[1]);ctx.stroke();ctx.setLineDash([])})}
function accents(){hitPolys=[];tiles.forEach(t=>{const p=t.points.map(project);hitPolys.push({i:t.i,p,depth:project([t.x,0,t.z])[2]});if(t.i===hover||selected?.i===t.i){const outline=t.points.map(v=>project([v[0],.45,v[2]]));ctx.beginPath();outline.forEach((v,i)=>i?ctx.lineTo(v[0],v[1]):ctx.moveTo(v[0],v[1]));ctx.closePath();ctx.strokeStyle=selected?.i===t.i?(night>.4?'#edcc8f':'#627f47'):'#f5f0d8';ctx.lineWidth=selected?.i===t.i?2.3:1.5;ctx.stroke()}})}
function labels(){if(!showLabels&&!selected)return;tiles.forEach(t=>{if(!showLabels&&selected?.i!==t.i)return;const p=project([t.x,.6,t.z]);ctx.font='500 12px "Noto Sans TC",sans-serif';const w=ctx.measureText(t.name).width+22,y=p[1]+19;ctx.fillStyle=night>.4?'#e3e6d9ed':'#faf9efee';ctx.strokeStyle='#a5b399';ctx.lineWidth=.7;ctx.beginPath();ctx.roundRect(p[0]-w/2,y,w,25,4);ctx.fill();ctx.stroke();ctx.fillStyle='#465d43';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(t.name,p[0],y+12.5)})}
function birds(){if(!showTraffic)return;ctx.strokeStyle=night>.4?'#bacbb08a':'#788e6c';ctx.lineWidth=1.2;for(let i=0;i<9;i++){const a=anim*.07+i*2.1,x=Math.sin(a)*6.2,z=Math.cos(a*.81)*6.6,p=project([x,2.1+(i%3)*.25,z]),flap=Math.sin(anim*5+i)*3;ctx.beginPath();ctx.moveTo(p[0]-6,p[1]+flap);ctx.quadraticCurveTo(p[0]-3,p[1]-2,p[0],p[1]);ctx.quadraticCurveTo(p[0]+3,p[1]-2,p[0]+6,p[1]+flap);ctx.stroke()}}
function boats(){if(!showTraffic)return;for(let i=0;i<2;i++){const a=anim*.027+i*Math.PI,x=Math.sin(a)*7.6,z=Math.cos(a)*6.9,p=project([x,-.35,z]);ctx.save();ctx.translate(p[0],p[1]);ctx.rotate(-.3+Math.sin(a)*.2);ctx.strokeStyle=night>.4?'#b7c8b22b':'#f9f9df9c';for(let j=0;j<3;j++){ctx.beginPath();ctx.moveTo(-8-j*5,-5-j*2);ctx.lineTo(-17-j*7,5+j*2);ctx.stroke()}polygon([[-10,-4],[9,-4],[15,1],[8,5],[-10,5]],'#b8b49a');ctx.fillStyle='#faf5dc';ctx.fillRect(-6,-7,12,7);ctx.fillStyle='#86a99a';ctx.fillRect(-2,-10,7,5);ctx.restore()}}
function resize(){const rect=$('#scene').getBoundingClientRect();W=rect.width;H=rect.height;dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);cx=W*.5;cy=H*(innerWidth<=700?.52:.53)}new ResizeObserver(resize).observe($('#scene'));
function frame(ms){const dt=Math.min((ms-last)/1000||0,.05);last=ms;if(!paused)anim+=dt;const lerp=1-Math.exp(-dt*5);for(const k of Object.keys(view))view[k]+=(target[k]-view[k])*lerp;timeValue+=(timeTarget-timeValue)*Math.min(1,dt*2);night=Math.max(0,Math.min(1,(timeValue-2)*1.1));S=Math.min(W/15,H/12)*view.zoom;if(innerWidth<=700)S=Math.min(W/12.4,H/15)*view.zoom;water();boats();drawGeometry(dynamicGeometry());accents();links();labels();birds();requestAnimationFrame(frame)}
function contains(x,y,poly){let inside=false;for(let i=0,j=poly.length-1;i<poly.length;j=i++){const a=poly[i],b=poly[j];if((a[1]>y)!==(b[1]>y)&&x<(b[0]-a[0])*(y-a[1])/(b[1]-a[1])+a[0])inside=!inside}return inside}
function pick(x,y){const matches=hitPolys.filter(t=>contains(x,y,t.p));return matches.length?matches.sort((a,b)=>b.depth-a.depth)[0].i:-1}
canvas.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY,yaw:target.yaw,elev:target.elev};moved=false;canvas.setPointerCapture(e.pointerId);canvas.classList.add('dragging');$('#tooltip').style.display='none'});
canvas.addEventListener('pointermove',e=>{const rect=canvas.getBoundingClientRect(),x=e.clientX-rect.left,y=e.clientY-rect.top;if(drag){const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.hypot(dx,dy)>5)moved=true;if(moved){target.yaw=drag.yaw-dx*.006;target.elev=Math.max(.38,Math.min(1.36,drag.elev+dy*.003));$('#aerial').classList.toggle('active',target.elev>1)}return}hover=pick(x,y);const tip=$('#tooltip');if(hover>=0){tip.innerHTML=esc(tiles[hover].name)+'<small>點選探索 ↗</small>';tip.style.display='block';tip.style.left=Math.max(5,Math.min(W-170,x+14))+'px';tip.style.top=Math.max(5,y-40)+'px';canvas.style.cursor='pointer'}else{tip.style.display='none';canvas.style.cursor='grab'}});
canvas.addEventListener('pointerup',e=>{if(!moved){const r=canvas.getBoundingClientRect(),i=pick(e.clientX-r.left,e.clientY-r.top);if(i>=0)choose(i)}drag=null;canvas.classList.remove('dragging')});canvas.addEventListener('pointercancel',()=>{drag=null;canvas.classList.remove('dragging')});canvas.addEventListener('pointerleave',()=>{hover=-1;$('#tooltip').style.display='none'});canvas.addEventListener('wheel',e=>{e.preventDefault();target.zoom=Math.max(.6,Math.min(2.4,target.zoom*Math.exp(-e.deltaY*.001)))},{passive:false});
showList();resize();requestAnimationFrame(frame);
})();
</script>
